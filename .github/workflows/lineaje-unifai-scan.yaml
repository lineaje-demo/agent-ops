name: Lineaje AI Policy Scan

on:
  workflow_dispatch:

jobs:
  lineaje-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install mcp==1.27.1

      - name: Prepare scanner
        run: |
          # Preserve the scanner before removing .github from scan input
          cp .github/scm_scan.py /tmp/scm_scan.py

          # Exclude GitHub config/workflows/scripts from the scan
          rm -rf .github

      - name: Run Lineaje AI policy scan
        env:
          LINEAJE_PAT_TOKEN: ${{ secrets.LINEAJE_PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python /tmp/scm_scan.py \
            --source-path . \
            --create-fix-pr
            | tee scan_result.txt

      - name: Publish scan result to job summary
        if: always()
        run: |
          if [ -f scan_result.txt ]; then
            cat scan_result.txt >> "$GITHUB_STEP_SUMMARY"
          fi
